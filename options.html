<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsHeader">Element Blocker - Settings & Management</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>🛡️ <span data-i18n="optionsHeader">Element Blocker - Settings & Management</span></h1>
    <div style="display: flex; align-items: center;">
      <label for="langSelect" style="margin-right: 8px; font-weight: bold; font-size: 13px;" data-i18n="langLabel">Language:</label>
      <select id="langSelect" style="padding: 5px; border-radius: 4px; border: 1px solid #dadce0; font-size: 13px;">
        <option value="en">English</option>
        <option value="th">ไทย (Thai)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-header" style="flex-direction: column; align-items: stretch; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <p style="margin: 0;" data-i18n="optionsSubHeader">All saved rules and selectors categorized by website:</p>
        <button class="btn-add" id="addNewRuleBtn" data-i18n="addWebBtn">+ Add New Website</button>
      </div>
      <div>
        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search website or selector..." style="width: 100%; padding: 8px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 13px;">
      </div>
    </div>
    <div id="storageContent" data-i18n="loadingText">Loading...</div>
    
    <div id="paginationContainer" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px;"></div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle" data-i18n="modalTitleNewSite">Add New Website & Selector</h3>
      <div class="modal-body">
        <div id="hostnameRow">
          <label data-i18n="hostnameLabel">Website (Hostname):</label>
          <input type="text" id="hostnameInput" placeholder="example.com">
        </div>
        <div class="modal-row">
          <div class="modal-col">
            <label data-i18n="cssSelectorLabel">CSS Selector:</label>
            <textarea id="editInput"></textarea>
          </div>
          <div class="modal-col">
            <label data-i18n="previewLabel">Matching Website Elements (Preview):</label>
            <div class="preview-box" id="previewBox" data-i18n="previewPlaceholder">Type selector to preview...</div>
          </div>
        </div>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" id="cancelBtn" data-i18n="cancelBtn">❌ Cancel</button>
        <button class="btn-save" id="saveBtn" data-i18n="saveBtn">💾 Save</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
