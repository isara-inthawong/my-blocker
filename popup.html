<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header-container">
    <h3>🛡️ <span data-i18n="extName">Element Blocker</span></h3>
    <button id="openTabBtn" class="icon-setting-btn" data-i18n-title="settingsTitleTooltip" title="Open settings page">⚙️</button>
  </div>

  <button id="pickBtn" class="hero-btn" data-i18n-title="pickBtnTooltip" title="Click to select and hide element">
    🎯
  </button>
  
  <div class="section-label" data-i18n="customSelectorLabel">Custom Selector:</div>
  <div class="custom-box">
    <input type="text" id="customInput" data-i18n-placeholder="customInputPlaceholder" placeholder="e.g. img[src$='.gif'] or div.ad-banner">
    <button id="addCustomBtn" class="add-icon-btn" data-i18n-title="addBtnTooltip" title="Add Custom Selector">➕</button>
  </div>
  <div class="hint" id="editHint" data-i18n="editHintText">💡 Click ✏️ on items below to edit</div>

  <div class="section-label" data-i18n="hiddenListLabel">Hidden items on this site:</div>
  <ul id="hiddenList">
    <li style="justify-content:center; color:#999; cursor:default; border:none; background:transparent;" data-i18n="noItemsText">No hidden items yet</li>
  </ul>
  
  <button id="resetBtn" class="hero-btn danger" data-i18n-title="resetBtnTooltip" title="Reset all for this site">
    🗑️
  </button>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
