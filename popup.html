<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 270px;
      font-family: sans-serif;
      padding: 12px;
      margin: 0;
    }
    h3 {
      font-size: 14px;
      margin-top: 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 7px;
      margin-bottom: 8px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background-color: #1557b0;
    }
    .secondary {
      background-color: #5f6368;
    }
    .secondary:hover {
      background-color: #484c50;
    }
    .danger {
      background-color: #d93025;
    }
    .danger:hover {
      background-color: #b31412;
    }
    .warning {
      background-color: #f9ab00;
      color: #202124;
    }
    .warning:hover {
      background-color: #e09d00;
    }
    .custom-box {
      display: flex;
      gap: 5px;
      margin-bottom: 4px;
    }
    .custom-box input {
      flex: 1;
      padding: 5px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .custom-box button {
      width: auto;
      margin-bottom: 0;
      padding: 5px 10px;
    }
    .hint {
      font-size: 10px;
      color: #888;
      margin-bottom: 8px;
    }
    ul {
      max-height: 110px;
      overflow-y: auto;
      padding-left: 0;
      list-style: none;
      font-size: 11px;
      color: #555;
      margin: 5px 0;
      border: 1px solid #eee;
      padding: 5px;
      border-radius: 4px;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding: 2px 4px;
      border-radius: 3px;
    }
    li:hover {
      background-color: #f1f3f4;
    }
    li span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 5px;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      gap: 3px;
    }
    li button {
      width: auto;
      padding: 2px 5px;
      margin-bottom: 0;
      font-size: 10px;
    }
    .btn-edit {
      background-color: #f9ab00;
      color: #202124;
    }
    .btn-edit:hover {
      background-color: #e09d00;
    }
    .btn-del {
      background-color: #d93025;
    }
    .btn-del:hover {
      background-color: #b31412;
    }
    p {
      font-size: 11px;
      color: #666;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h3>Element Blocker Pro</h3>
  <button id="pickBtn">🖱️ คลิกเพื่อเลือกซ่อนแท็ก</button>
  <button id="openTabBtn" class="secondary">🗗 เปิดหน้าตั้งค่าเป็นแท็บใหม่</button>
  
  <p>Custom Selector:</p>
  <div class="custom-box">
    <input type="text" id="customInput" placeholder="เช่น img[src$='.gif']">
    <!-- img[src*='example.com'] -->
    <button id="addCustomBtn">เพิ่ม</button>
  </div>
  <div class="hint" id="editHint">💡 คลิกรายการด้านล่างเพื่อแก้ไข</div>

  <p>รายการที่ซ่อนในเว็บนี้:</p>
  <ul id="hiddenList"></ul>
  
  <button id="resetBtn" class="danger">🗑️ รีเซ็ตทั้งหมดของเว็บนี้</button>

  <script src="popup.js"></script>
</body>
</html>
